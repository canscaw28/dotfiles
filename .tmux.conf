# Enable mouse control
set -g mouse on

# Zsh on startup
set-option -g default-shell /bin/zsh

# True color, so the hex colors below (and programs inside tmux) get iTerm's
# exact palette instead of the nearest of 256.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'

# Forward extended keys (CSI u) to the inner program instead of collapsing them
# to legacy codes — lets bindings like Shift+Enter (^[[13;2u) reach zsh.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

### Look ###
# Colors are iTerm's own palette, so tmux and the terminal read as one thing:
#   background #18262f   text #a6afb8   muted #667581   bright #f5f7fa
#   pill #2a3d48   selection #586875
#   cyan-blue #33b5e1   purple #a363d5   teal #52cbb0   yellow #e4b51c   red #ef5253
# Labels are rounded pills (  are Nerd Font caps; iTerm uses
# MesloLGS NF).
set -g status-interval 5

# Panes: faint lines, inactive panes a shade darker, each labelled with its
# title in a pill (cyan-blue when focused). Programs set the title themselves
# (Claude Code names its session there, after a status glyph that is dropped);
# a pane without one shows its command. Pin one: tmux select-pane -T "name".
# prefix+T toggles the labels.
set -g pane-border-lines single
set -g pane-border-style "fg=#24363f"
set -g pane-active-border-style "fg=#2c4654"
set -g window-style "bg=#142027"
set -g window-active-style "bg=#18262f"
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#33b5e1#,bg=default]#[fg=#18262f#,bg=#33b5e1#,bold] #{?#{s/^[^A-Za-z0-9 ]* //:pane_title},#{s/^[^A-Za-z0-9 ]* //:pane_title},#{pane_current_command}} #[fg=#33b5e1#,bg=default#,nobold],#[fg=#2a3d48#,bg=default]#[fg=#a6afb8#,bg=#2a3d48] #{?#{s/^[^A-Za-z0-9 ]* //:pane_title},#{s/^[^A-Za-z0-9 ]* //:pane_title},#{pane_current_command}} #[fg=#2a3d48#,bg=default]} "
bind T if -F '#{==:#{pane-border-status},off}' 'set -g pane-border-status top' 'set -g pane-border-status off'

# Status bar, in the same pills. Left: the session (yellow while the prefix key
# is held), then windows (a zoomed one gets an expand mark). Right: where the
# focused pane is (repo and branch, which a running Claude hides from the
# prompt), user@host, battery, date and time.
set -g status-position bottom
set -g status-justify left
# The bar is on the terminal's own (lighter) background, so it runs into the
# strip iTerm paints below the last full row.
set -g status-style "bg=default,fg=#667581"
# Two status lines: a faint rule along the top of the bar's lighter shade,
# setting the bar off from the panes the way panes are set off from each
# other, then the bar itself (the default format, moved down a line). The rule is 400
# padded spaces turned into top-edge bars (▔, so the row's space falls between
# the rule and the pills); tmux clips what doesn't fit. The unset first keeps
# a reload from copying the already-replaced line.
set -gu status-format
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' '#[fg=#24363f,bg=default]#{s/ /▔/:#{p400:@none}}'
set -g status 2
set -g status-left-length 40
set -g status-right-length 140
set -g status-left " #[fg=#{?client_prefix,#e4b51c,#a363d5},bg=default]#[fg=#18262f,bg=#{?client_prefix,#e4b51c,#a363d5},bold] #S #[fg=#{?client_prefix,#e4b51c,#a363d5},bg=default,nobold]  "
set -g window-status-separator " "
set -g window-status-format "#[fg=#667581] #I #{s/\\.exe$//:window_name}#{?window_zoomed_flag, ,} "
set -g window-status-current-format "#[fg=#33b5e1,bg=default]#[fg=#18262f,bg=#33b5e1,bold] #I #{s/\\.exe$//:window_name}#{?window_zoomed_flag, ,} #[fg=#33b5e1,bg=default,nobold]"
set -g window-status-bell-style "fg=#ef5253,bold"
set -g status-right "#[fg=#2a3d48,bg=default]#[fg=#a6afb8,bg=#2a3d48] #(~/.local/bin/tmux-where.sh '#{pane_current_path}') #[fg=#2a3d48,bg=default]  #[fg=#667581]#(whoami)@#h  #(~/.local/bin/tmux-battery.sh)  %a %b %-d #[fg=#52cbb0,bg=default]#[fg=#18262f,bg=#52cbb0,bold] %H:%M #[fg=#52cbb0,bg=default,nobold] "

# Everything else tmux draws, in the same palette.
set -g message-style "bg=#2a3d48,fg=#f5f7fa"
set -g message-command-style "bg=#2a3d48,fg=#33b5e1"
set -g mode-style "bg=#586875,fg=#f5f7fa"
set -g clock-mode-colour "#33b5e1"
set -g popup-style "bg=#18262f"
set -g popup-border-style "fg=#2a3d48"
set -g menu-style "bg=#2a3d48,fg=#a6afb8"
set -g menu-selected-style "bg=#33b5e1,fg=#18262f"
set -g menu-border-style "fg=#2a3d48"
