# Help overlay trigger (momentary peek, realtime).
#
# Hold caps+/ to show the cheat sheet; release to hide. While held, the
# overlay follows whichever layer key is also held (caps+/ -> index,
# caps+T+/ -> T layer, switch live by pressing/releasing layer keys) — the
# layer setters notify help_overlay.layerDown/Up, so no re-press of / is
# needed. See .hammerspoon/help_overlay.lua + key_suppress.lua.
#
# One manipulator handles every layer: it fires for caps+/ with any of
# a/f/g/t/r (or none) held, but NOT in the workspace submodes (W/E/3/4) or
# Q — there `/` keeps its own meaning (workspace `/`, surround `//`).
# Built before the layer files so it wins over each layer's slash binding.
#
# Freeing `/` for help relocated: A+/ -> A+P (Clean Dock),
# G+/ -> G+\ (Detach tab), T+/ -> T+P (Toggle tiles).
# Overlay data is generated from README.md by build_help.py.

sections:
- layer: [caps]
  negative_conditions: [w, e, '3', '4', q]
  manipulators:
  - from: slash
    description: "caps+/: Toggle hotkey help overlay"
    to:
    - shell: /usr/local/bin/hs -c 'require("help_overlay").open()'
    to_after_key_up:
    - shell: /usr/local/bin/hs -c 'require("help_overlay").close()'
