    description: "G+/: Show Application layer help"
    to:
    - shell: /usr/local/bin/hs -c 'require("help_overlay").show("G")'
    to_after_key_up:
    - shell: /usr/local/bin/hs -c 'require("help_overlay").hide()'

- layer: [caps, t]
  manipulators:
