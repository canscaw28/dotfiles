- layer: [caps, r]
  manipulators:
  - from: slash
    description: "R+/: Show App layer help"
    to:
    - shell: /usr/local/bin/hs -c 'require("help_overlay").show("R")'
    to_after_key_up:
    - shell: /usr/local/bin/hs -c 'require("help_overlay").hide()'
